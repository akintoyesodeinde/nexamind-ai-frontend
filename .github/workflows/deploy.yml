name: Deploy Frontend to Azure Container Apps (OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment
        required: true
        default: azure-dev
        type: choice
        options:
          - azure-dev
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-deploy-${{ inputs.environment || 'azure-dev' }}
  cancel-in-progress: false

jobs:
  build-scan-and-deploy:
    name: Build, Scan & Deploy React/Nginx SPA
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'azure-dev' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute immutable release tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "rev_suffix=rev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production Nginx SPA image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          tags: nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}

      - name: Local SPA Container Smoke Test
        run: |
          docker run -d --name nexamind-fe-release -p 8080:8080 "nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}"
          sleep 2
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q "NexaMind AI"
          docker rm -f nexamind-fe-release

      - name: Scan production image with Trivy (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Authenticate to Azure via Microsoft Entra OIDC (Zero Secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push immutable SPA image to ACR and deploy Container App revision
        run: |
          ACR_NAME="${{ vars.AZURE_ACR_NAME }}"
          ACR_SERVER="${ACR_NAME}.azurecr.io"
          az acr login --name "${ACR_NAME}"
          docker tag "nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}" "${ACR_SERVER}/nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}"
          docker push "${ACR_SERVER}/nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}"

          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name ca-nexamind-web \
            --image "${ACR_SERVER}/nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}" \
            --revision-suffix "${{ steps.meta.outputs.rev_suffix }}"

      - name: Post-Deploy Live SPA Smoke Test
        run: |
          WEB_FQDN=$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name ca-nexamind-web \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          for i in $(seq 1 10); do
            if curl -fsS "https://${WEB_FQDN}/healthz" && curl -fsS "https://${WEB_FQDN}/" | grep -q "NexaMind AI"; then
              echo "Frontend SPA verified live at https://${WEB_FQDN}"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Frontend post-deploy smoke test failed."
          exit 1
