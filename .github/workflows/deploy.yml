name: Deploy Frontend to Azure VM (Docker Hub + Entra OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Deployment Environment
        required: true
        default: azure-dev
        type: choice
        options:
          - azure-dev
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: nexamind-frontend-deploy-${{ inputs.environment || 'azure-dev' }}
  cancel-in-progress: false

jobs:
  build-scan-push-and-deploy:
    name: Build, Scan, Push to Docker Hub & Deploy SPA via Entra OIDC VM Run Command
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'azure-dev' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute immutable release tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required non-secret deployment variables
        run: |
          for v in DOCKERHUB_USERNAME AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_VM_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required GitHub Environment Variable: ${v}"
              exit 1
            fi
          done
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production non-root Nginx SPA image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          load: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}

      - name: Local SPA Container Smoke Test
        run: |
          docker run -d --name nexamind-fe-release -p 8080:8080 "${{ vars.DOCKERHUB_USERNAME }}/nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}"
          sleep 2
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -q "NexaMind AI"
          docker rm -f nexamind-fe-release

      - name: Scan production image with Trivy (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/nexamind-ai-frontend:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Authenticate to Docker Hub (Scoped Access Token — Never Account Password)
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push immutable versioned SPA image to Docker Hub
        run: |
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/nexamind-ai-frontend"
          TAG="${{ steps.meta.outputs.image_tag }}"
          docker push "${IMAGE}:${TAG}"
          if [ -n "${{ steps.meta.outputs.release_tag }}" ]; then
            docker tag "${IMAGE}:${TAG}" "${IMAGE}:${{ steps.meta.outputs.release_tag }}"
            docker push "${IMAGE}:${{ steps.meta.outputs.release_tag }}"
          fi

      - name: Authenticate to Azure via Microsoft Entra OIDC (Zero Client Secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Frontend SPA & Reverse Proxy on Azure VM via VM Run Command
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          cat <<'SCRIPT' > /tmp/deploy-frontend.sh
          #!/usr/bin/env bash
          set -euo pipefail
          DOCKERHUB_USER="$1"
          NEW_TAG="$2"

          mkdir -p /opt/nexamind/releases
          touch /opt/nexamind/.env.deploy
          chmod 640 /opt/nexamind/.env.deploy

          PREV_TAG=$(grep '^FRONTEND_IMAGE_TAG=' /opt/nexamind/.env.deploy | cut -d= -f2 || true)
          if [ -n "${PREV_TAG}" ] && [ "${PREV_TAG}" != "${NEW_TAG}" ]; then
            echo "${PREV_TAG}" > /opt/nexamind/releases/frontend.previous
          fi

          grep -q '^DOCKERHUB_USERNAME=' /opt/nexamind/.env.deploy \
            && sed -i "s|^DOCKERHUB_USERNAME=.*|DOCKERHUB_USERNAME=${DOCKERHUB_USER}|" /opt/nexamind/.env.deploy \
            || echo "DOCKERHUB_USERNAME=${DOCKERHUB_USER}" >> /opt/nexamind/.env.deploy

          grep -q '^FRONTEND_IMAGE_TAG=' /opt/nexamind/.env.deploy \
            && sed -i "s|^FRONTEND_IMAGE_TAG=.*|FRONTEND_IMAGE_TAG=${NEW_TAG}|" /opt/nexamind/.env.deploy \
            || echo "FRONTEND_IMAGE_TAG=${NEW_TAG}" >> /opt/nexamind/.env.deploy

          docker compose --env-file /opt/nexamind/.env.deploy -f /opt/nexamind/compose.prod.yaml pull frontend proxy
          docker compose --env-file /opt/nexamind/.env.deploy -f /opt/nexamind/compose.prod.yaml up -d frontend proxy

          # Verify BOTH Frontend SPA and Frontend-to-Backend reverse proxy connectivity over HTTPS
          for i in $(seq 1 10); do
            if curl -kfsS https://127.0.0.1/ | grep -q "NexaMind AI" \
              && curl -kfsS https://127.0.0.1/api/v1/health/live > /dev/null; then
              echo "${NEW_TAG}" > /opt/nexamind/releases/frontend.current
              echo "FRONTEND_DEPLOY_VERIFIED=${NEW_TAG}"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Frontend SPA or backend proxy connectivity check failed."
          exit 1
          SCRIPT

          az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --scripts @/tmp/deploy-frontend.sh \
            --parameters "${DOCKERHUB_USERNAME}" "${IMAGE_TAG}" \
            --query "value[0].message" -o tsv | tee /tmp/vm-fe-deploy.log

          grep -q "FRONTEND_DEPLOY_VERIFIED=${IMAGE_TAG}" /tmp/vm-fe-deploy.log
